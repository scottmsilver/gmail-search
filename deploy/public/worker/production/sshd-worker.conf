# Dedicated VM only. Install as /etc/ssh/sshd_config.d/60-gmail-worker.conf.
# Root-owned authorized key files; provision separate keys out of band.
#
# Every directive below must be legal inside a Match block. `Include` does not
# close an enclosing Match, so this file parses at whatever scope it is included
# at, and one global-only directive here fails the *entire* server config -- which
# is what stopped enrolment on 2026-09-15. PermitUserEnvironment is asserted by
# effective-policy validation instead of declared here: `no` is the OpenSSH default,
# and a drop-in cannot override an earlier value regardless, since sshd keeps the
# first one it reads. Stating it bought nothing and cost the whole config.

Match User gmail-full-agent-rpc
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/gmail-worker/rpc-authorized-keys
    ForceCommand /usr/bin/python3 -I /opt/gmail-worker/full_agent_rpc_frontend.py
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    MaxSessions 1

Match User gmail-gateway-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/gmail-worker/tunnel-authorized-keys
    ForceCommand /usr/bin/false
    MaxSessions 0
    PermitTTY no
    PermitUserRC no
    AllowAgentForwarding no
    X11Forwarding no
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    PermitOpen none
    PermitListen 127.0.0.1:18081
    GatewayPorts no
    PermitTunnel no
Match all
